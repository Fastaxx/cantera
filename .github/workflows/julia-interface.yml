# CI for the experimental Julia interface (interfaces/julia).
#
# Builds libcantera *from this checkout* (so the generated CLib matches the
# bindings, including functions this branch adds/renames), then runs the Julia
# test suite against the freshly built library on Linux and on Windows (MSVC).
name: Julia interface

on:
  push:
    paths:
      - 'interfaces/julia/**'
      - 'interfaces/sourcegen/**'
      - 'interfaces/clib/**'
      - '.github/workflows/julia-interface.yml'
  pull_request:
    paths:
      - 'interfaces/julia/**'
      - 'interfaces/sourcegen/**'
      - 'interfaces/clib/**'
      - '.github/workflows/julia-interface.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['lts', '1']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build dependencies (conda)
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          activate-environment: build
          python-version: '3.12'
          channels: conda-forge

      - name: Install Cantera build dependencies
        run: |
          # Build toolchain + C++ deps, plus sourcegen's Python deps (jinja2,
          # ruamel.yaml) which are needed to regenerate the CLib during the build.
          conda install -y scons cython "eigen" sundials fmt yaml-cpp hdf5 \
            "boost-cpp" doxygen openblas jinja2 "ruamel.yaml"

      - name: Build libcantera (shared)
        run: |
          cat > cantera.conf <<EOF
          prefix = '${CONDA_PREFIX}'
          python_package = 'n'
          f90_interface = 'n'
          system_eigen = 'y'
          system_sundials = 'y'
          system_fmt = 'y'
          system_yamlcpp = 'y'
          system_blas_lapack = 'y'
          extra_inc_dirs = '${CONDA_PREFIX}/include'
          extra_lib_dirs = '${CONDA_PREFIX}/lib'
          boost_inc_dir = '${CONDA_PREFIX}/include'
          googletest = 'none'
          EOF
          # `scons build` regenerates the CLib and the low-level Julia bindings
          # from interfaces/sourcegen and auto-generates the doxygen tag it
          # needs (doxygen installed above).
          scons build -j2

      - name: Set up Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia-version }}

      - name: Run tests
        env:
          CANTERA_LIBRARY_PATH: ${{ github.workspace }}/build/lib
          CANTERA_DATA: ${{ github.workspace }}/data
        run: |
          julia --project=interfaces/julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=interfaces/julia interfaces/julia/test/runtests.jl

  test-windows:
    name: Julia ${{ matrix.julia-version }} on windows-2022 (MSVC)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['lts', '1']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up build dependencies (conda)
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          activate-environment: build
          python-version: '3.12'
          channels: conda-forge

      - name: Install Cantera build dependencies
        run: |
          conda install -y scons ruamel.yaml jinja2 doxygen boost-cpp eigen \
            yaml-cpp highfive "fmt=12.0" openblas

      - name: Build libcantera (shared)
        # Run from PowerShell rather than Git Bash, whose `link` would shadow the
        # MSVC linker.
        shell: pwsh
        run: |
          scons build -j4 toolchain=msvc debug=n f90_interface=n python_package=n `
            system_eigen=y system_yamlcpp=y system_highfive=y `
            blas_lapack_libs=openblas

      - name: Set up Julia
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: ${{ matrix.julia-version }}

      - name: Run tests
        # CANTERA_LIBRARY_PATH is deliberately left unset, so that the tests also
        # cover finding `cantera_shared.dll` in the build tree (gh-2192).
        env:
          CANTERA_DATA: ${{ github.workspace }}\data
        run: |
          julia --project=interfaces/julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=interfaces/julia -e \
            'using Cantera; println("Loaded ", Cantera.LibCantera.libcantera)'
          julia --project=interfaces/julia interfaces/julia/test/runtests.jl
