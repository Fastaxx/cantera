# CI for the experimental Julia interface (interfaces/julia).
#
# Builds libcantera *from this checkout* (so the generated CLib matches the
# bindings, including functions this branch adds/renames), then runs the Julia
# test suite against the freshly built library on Linux.
name: Julia interface

on:
  push:
    paths:
      - 'interfaces/julia/**'
      - 'interfaces/sourcegen/**'
      - 'interfaces/clib/**'
      - '.github/workflows/julia-interface.yml'
  pull_request:
    paths:
      - 'interfaces/julia/**'
      - 'interfaces/sourcegen/**'
      - 'interfaces/clib/**'
      - '.github/workflows/julia-interface.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['lts', '1']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build dependencies (conda)
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          activate-environment: build
          python-version: '3.12'
          channels: conda-forge

      - name: Install Cantera build dependencies
        run: |
          # Build toolchain + C++ deps, plus sourcegen's Python deps (jinja2,
          # ruamel.yaml) which are needed to regenerate the CLib during the build.
          conda install -y scons cython "eigen" sundials fmt yaml-cpp hdf5 \
            "boost-cpp" doxygen openblas jinja2 "ruamel.yaml"

      - name: Build libcantera (shared)
        run: |
          cat > cantera.conf <<EOF
          prefix = '${CONDA_PREFIX}'
          python_package = 'n'
          f90_interface = 'n'
          system_eigen = 'y'
          system_sundials = 'y'
          system_fmt = 'y'
          system_yamlcpp = 'y'
          system_blas_lapack = 'y'
          extra_inc_dirs = '${CONDA_PREFIX}/include'
          extra_lib_dirs = '${CONDA_PREFIX}/lib'
          boost_inc_dir = '${CONDA_PREFIX}/include'
          googletest = 'none'
          EOF
          # `scons build` regenerates the CLib and the low-level Julia bindings
          # from interfaces/sourcegen and auto-generates the doxygen tag it
          # needs (doxygen installed above).
          scons build -j2

      - name: Set up Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia-version }}

      - name: Run tests
        env:
          CANTERA_LIBRARY_PATH: ${{ github.workspace }}/build/lib
          CANTERA_DATA: ${{ github.workspace }}/data
        run: |
          julia --project=interfaces/julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=interfaces/julia interfaces/julia/test/runtests.jl

      # The source distribution is what the Yggdrasil recipe for Cantera_jll builds:
      # check that it builds with CMake alone and that the library passes the tests.
      - name: Build the CLib source distribution with CMake
        if: matrix.julia-version == '1'
        run: |
          conda install -y cmake
          scons clib-sdist julia-package
          mkdir -p build/clib_test
          tar -xzf build/clib_sdist/cantera-clib-*.tar.gz -C build/clib_test
          cmake -S build/clib_test/cantera-clib-* -B build/clib_test/build \
            -DCMAKE_PREFIX_PATH="${CONDA_PREFIX}" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/build/clib_test/install" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON
          cmake --build build/clib_test/build --parallel 2
          cmake --install build/clib_test/build

      - name: Run tests against the library from the source distribution
        if: matrix.julia-version == '1'
        env:
          CANTERA_LIBRARY_PATH: ${{ github.workspace }}/build/clib_test/install/lib
          CANTERA_DATA: ${{ github.workspace }}/build/clib_test/install/share/cantera/data
        run: |
          julia --project=interfaces/julia interfaces/julia/test/runtests.jl
          # The assembled package depends on exactly this version of Cantera_jll.
          julia -e 'using TOML
            p = TOML.parsefile("build/julia/Project.toml")
            @assert haskey(p["deps"], "Cantera_jll")
            @assert p["compat"]["Cantera_jll"] == "=" * p["version"]'
